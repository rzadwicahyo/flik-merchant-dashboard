name: Smart courier service
on:
  pull_request:
    paths: ['services/smart-courier/**', '.github/workflows/smart-courier.yml']
  push:
    branches: [main]
    paths: ['services/smart-courier/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/smart-courier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/smart-courier/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
